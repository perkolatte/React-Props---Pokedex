<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pokédex</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <link
      rel="icon"
      type="image/png"
      href="assets/original_gb_screenshot_pikachu.png"
    />
    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <svg style="position: absolute; width: 0; height: 0">
      <defs>
        <filter id="gbc-colors">
          <feComponentTransfer>
            <feFuncR type="discrete" tableValues="0 0.25 0.5 0.75 1" />
            <feFuncG type="discrete" tableValues="0 0.25 0.5 0.75 1" />
            <feFuncB type="discrete" tableValues="0 0.25 0.5 0.75 1" />
          </feComponentTransfer>
        </filter>
      </defs>
    </svg>
    <div id="root"></div>

    <script type="text/babel" src="utils/spriteUtils.js"></script>
    <script type="text/babel" src="utils/trainerUtils.js"></script>
    <script type="text/babel" src="components/Pokecard.js"></script>
    <script type="text/babel" src="components/Pokedex.js"></script>
    <script type="text/babel" src="components/Pokegame.js"></script>
    <script type="text/babel" src="components/App.js"></script>
    <script type="text/babel" src="scripts/index.js"></script>
  </body>
</html>
